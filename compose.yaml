services:
  database:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: symfony_db
    ports:
      - "3306:3306"
    volumes:
      - sf_mysql_data:/var/lib/mysql

  web:
    build: .
    volumes:
      - ./symfony-app:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "mysql://root:root_password@db:3306/symfony_db?serverVersion=8.4.0-bermey"
    depends_on:
      - database
    command: symfony server:start --port=8000 --no-tls --allow-all-ip

volumes:
  sf_mysql_data: